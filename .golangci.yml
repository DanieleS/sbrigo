version: "2"
linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - gosec
    - bodyclose
    - noctx
    - errorlint
    - gocritic
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, noctx, errcheck, bodyclose]
      # G124 wants a literal Secure: true on every cookie. Ours is Secure whenever
      # SBRIGO_PUBLIC_URL is https and must stay configurable for plain-http LAN deployments.
      - linters: [gosec]
        text: "G124"
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/danieles/sbrigo]
