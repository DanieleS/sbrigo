version: "2"
linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - gosec
    - bodyclose
    - noctx
    - errorlint
    - gocritic
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, noctx, errcheck, bodyclose]
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/danieles/sbrigo]
