# Local development / homelab example. In the homelab the app points at the existing PostgreSQL
# and Redis instances: drop the `db` and `redis` services and set SBRIGO_DATABASE_URL / SBRIGO_REDIS_URL.
services:
  sbrigo:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      SBRIGO_DATABASE_URL: ${SBRIGO_DATABASE_URL:-postgres://sbrigo:sbrigo@db:5432/sbrigo?sslmode=disable}
      SBRIGO_REDIS_URL: ${SBRIGO_REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sbrigo
      POSTGRES_PASSWORD: sbrigo
      POSTGRES_DB: sbrigo
    volumes:
      - sbrigo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbrigo"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - sbrigo-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sbrigo-db:
  sbrigo-redis:
